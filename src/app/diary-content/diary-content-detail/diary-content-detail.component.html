<h1 class="card-title">{{ title }}</h1>
<table class="table">
  <thead>
    <tr>
      <th scope="col">記事ID</th>
      <th scope="col">タイトル</th>
      <th scope="col">内容</th>
      <th scope="col">作成日時</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>{{ contentId }}</td>
      <td>{{ diaryTitle }}</td>
      <td>{{ diaryContent }}</td>
      <td>{{ createdAt }}</td>
    </tr>
  </tbody>
</table>
