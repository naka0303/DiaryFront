<app-header></app-header>
<h1 class="card-title">{{ title }}</h1>
<table class="table">
  <thead>
    <tr>
      <th scope="col">記事ID</th>
      <th scope="col">タイトル</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let content of registeredDiaryContents">
      <th scope="row"><a [routerLink]="['/diary-content-detail', content.contentId]">{{ content.contentId }}</a></th>
      <td>{{ content.diaryTitle }}</td>
      <td><button type="button">削除</button></td>
      <td><button type="button">編集</button></td>
    </tr>
  </tbody>
</table>
