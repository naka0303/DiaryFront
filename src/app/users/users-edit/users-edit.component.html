<h1 class="card-title">{{ title }}</h1>
<form style="width: 100%;" [formGroup]="userForm" (ngSubmit)="onEditUser()">
  <div>
    <div class="row mb-3">
      <label class="col-sm-2 col-form-label">ユーザー名：</label>
      <div class="col-sm-10">
        <input style="width: 25%;" type="text" formControlName="username" [(ngModel)]="username" class="form-control">
      </div>
    </div>
  </div>
  <div>
    <div class="row mb-3">
      <label class="col-sm-2 col-form-label">年齢：</label>
      <div class="col-sm-10">
        <input style="width: 10%;" type="number" formControlName="age" [(ngModel)]="age" class="form-control">
      </div>
    </div>
  </div>
  <div>
    <div class="row mb-3">
      <label class="col-sm-2 col-form-label">メールアドレス：</label>
      <div class="col-sm-10">
        <input style="width: 35%;" type="email" formControlName="email" [(ngModel)]="email" class="form-control">
      </div>
    </div>
  </div>
  <div>
    <div class="row mb-3">
      <label class="col-sm-2 col-form-label">権限：</label>
      <div class="col-sm-10">
        <select formControlName="auth">
          <option value="">選択してください</option>
          <option *ngFor="let auth of auths">
            {{ auth }}
          </option>
        </select>
      </div>
    </div>
  </div>
  <button class="btn btn-primary">編集</button>
</form>
