<h1 class="card-title">{{ title }}</h1>
<form style="width: 100%;" [formGroup]="userForm" (ngSubmit)="onRegisterUser(userForm.value)">
  <div>
    <div class="row mb-3">
      <label class="col-sm-2 col-form-label">ユーザー名：</label>
      <div class="col-sm-10">
        <input class="form-control" style="width: 25%;" type="text" formControlName="username">
      </div>
    </div>
    <div class="row mb-3">
      <label class="col-sm-2 col-form-label">年齢：</label>
      <div class="col-sm-10">
        <input class="form-control" style="width: 5%;" type="number" formControlName="age">
      </div>
    </div>
    <div class="row mb-3">
      <label class="col-sm-2 col-form-label">メールアドレス：</label>
      <div class="col-sm-10">
        <input class="form-control" style="width: 25%;" type="email" formControlName="email">
      </div>
    </div>
    <div class="row mb-3">
      <label class="col-sm-2 col-form-label">パスワード：</label>
      <div class="col-sm-10">
        <input class="form-control" style="width: 25%;" type="password" formControlName="password">
      </div>
    </div>
    <div class="row mb-3">
      <label class="col-sm-2 col-form-label">権限：</label>
      <div class="col-sm-10">
        <input class="form-control" style="width: 5%;" type="text" formControlName="auth">
      </div>
    </div>
    <button class="btn btn-primary">登録</button>
  </div>
</form>
